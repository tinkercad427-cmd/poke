<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador de Pokémon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Buscador de Pokémon</h1>

    <form id="form" class="buscador" role="search">
      <label for="entrada" class="sr-only">Nombre o número del Pokémon</label>
      <div class="campo">
        <input id="entrada" type="search" placeholder="Nombre o número, por ejemplo pikachu o 25" autocomplete="off" required
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugerencias">
        <ul id="sugerencias" class="sugerencias" role="listbox" hidden></ul>
      </div>
      <button type="submit">Buscar</button>
    </form>

    <div class="acciones">
      <button type="button" id="anterior" disabled>Anterior</button>
      <button type="button" id="aleatorio">Aleatorio</button>
      <button type="button" id="siguiente" disabled>Siguiente</button>
    </div>

    <p id="estado" class="estado" role="status" aria-live="polite"></p>

    <article id="tarjeta" class="tarjeta" hidden>
      <div class="cabecera">
        <img id="imagen" alt="" width="260" height="260">
        <div>
          <p id="numero" class="numero"></p>
          <h2 id="nombre"></h2>
          <ul id="tipos" class="tipos"></ul>
          <p id="medidas" class="medidas"></p>
        </div>
      </div>

      <section>
        <h3>Estadísticas</h3>
        <ul id="stats" class="stats"></ul>
      </section>

      <section>
        <h3>Habilidades</h3>
        <ul id="habilidades" class="habilidades"></ul>
      </section>
    </article>
  </main>
  <script src="script.js"></script>
</body>
</html>
